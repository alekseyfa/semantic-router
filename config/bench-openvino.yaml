# Bench config: OpenVINO backend.
# Mission: measure the cost of the router's classification pipeline (intent +
# PII + jailbreak) under the OpenVINO inference backend, with no Candle
# fallbacks anywhere on the request path.
#
# Differences from bench-candle.yaml:
#   - this file is loaded by the router built with `-tags=openvino`, which
#     swaps the classifier factory functions to OpenVINO implementations.
#   - the YAML body is otherwise identical to bench-candle.yaml so the
#     comparison is apples-to-apples (same prompts, same decisions, same
#     thresholds). The only varying knob is the inference backend.
#
# Removed compared to the prior bench config (see git history):
#   - semantic_cache: every lookup ran candle_binding.GetEmbeddingBatched on
#     the request hot path, which would dominate any OV-vs-Candle comparison.
#   - tools: the tools DB needs an embedding model to load; bypassing it lets
#     us drop embedding_models entirely.
#   - embedding_models: nothing in this config needs an embedding model now,
#     so the qwen3 init at startup (Candle) is gone.
#   - response_api / router_replay / per-decision memory plugin: not on the
#     bench path; pure startup noise.
#
# Added so the bench actually exercises all three classifiers:
#   - signals.jailbreak: one rule pointing at the prompt-guard model.
#   - signals.pii: one rule pointing at the PII model.
#   - every decision's rule tree is `domain AND NOT jailbreak AND NOT pii`.
#     Benign prompts still match (jailbreak/pii signals don't fire), but the
#     classifiers run on every request — that is what we want to measure.

clear_route_cache: true

prompt_guard:
  enabled: true
  use_modernbert: false
  use_openvino: true
  openvino_device: "CPU"
  model_id: "models/mom-jailbreak-classifier"
  threshold: 0.7
  use_cpu: true
  jailbreak_mapping_path: "models/mom-jailbreak-classifier/label_mapping.json"

classifier:
  category_model:
    model_id: "models/mom-domain-classifier"
    threshold: 0.6
    use_cpu: true
    use_openvino: true
    openvino_device: "CPU"
    category_mapping_path: "models/mom-domain-classifier/category_mapping.json"
  pii_model:
    model_id: "models/mom-pii-classifier"
    use_modernbert: false
    threshold: 0.9
    use_cpu: true
    use_openvino: true
    openvino_device: "CPU"
    pii_mapping_path: "models/mom-pii-classifier/pii_type_mapping.json"

# Force the jailbreak + PII signals to run on every request.
# A signal type is only evaluated when at least one decision rule references
# it. Keeping these named "guard" / "pii_block" lets us reference them via
# `NOT jailbreak:guard` / `NOT pii:pii_block` in every decision below.
jailbreak:
  - name: "guard"
    threshold: 0.7
    description: "Block any input the prompt-guard model flags as a jailbreak."

pii:
  - name: "pii_block"
    threshold: 0.9
    pii_types_allowed: []
    description: "Block any input that contains any PII entity."

vllm_endpoints:
  - name: "xpu-llama3b"
    address: "127.0.0.1"
    port: 11434
    weight: 1
    type: "vllm"
  - name: "xpu-qwen7b"
    address: "127.0.0.1"
    port: 11435
    weight: 1
    type: "vllm"

model_config:
  "llama-3b":
    preferred_endpoints: ["xpu-llama3b"]
    external_model_ids:
      vllm: "meta-llama/Llama-3.2-3B-Instruct"
  "qwen-7b":
    reasoning_family: "qwen3"
    preferred_endpoints: ["xpu-qwen7b"]
    external_model_ids:
      vllm: "Qwen/Qwen2.5-7B-Instruct"

categories:

    mmlu_categories: ["math"]
  - name: physics
    description: "Physics and physical sciences"
    mmlu_categories: ["physics"]
  - name: "computer science"
    description: "Computer science and programming"
    mmlu_categories: ["computer science"]
  - name: philosophy
    description: "Philosophy and ethical questions"
    mmlu_categories: ["philosophy"]
  - name: engineering
    description: "Engineering and technical problem-solving"
    mmlu_categories: ["engineering"]

strategy: "priority"

# Each decision's rules form an AND of:
#   - domain match
#   - NOT jailbreak (forces the jailbreak classifier to run)
#   - NOT pii      (forces the PII classifier to run)
# This shape keeps benign prompts routable while making every request pay the
# jailbreak + PII cost — which is the comparison we want to measure.
decisions:
  - name: "business_decision"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "business"
        - operator: "NOT"
          conditions:
            - type: "jailbreak"
              name: "guard"
        - operator: "NOT"
          conditions:
            - type: "pii"
              name: "pii_block"
    modelRefs:
      - model: "llama-3b"
        use_reasoning: false

  - name: "law_decision"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "law"
        - operator: "NOT"

# Bench config: Candle backend.
# See bench-openvino.yaml for the rationale and methodology — this file is the
# Candle counterpart, identical in structure so the comparison is fair.

clear_route_cache: true

prompt_guard:
  enabled: true
  use_modernbert: false
  use_openvino: false
  openvino_device: "CPU"
  model_id: "models/mom-jailbreak-classifier"
  threshold: 0.7
  use_cpu: true
  jailbreak_mapping_path: "models/mom-jailbreak-classifier/label_mapping.json"

classifier:
  category_model:
    model_id: "models/mom-domain-classifier"
    threshold: 0.6
    use_cpu: true
    use_openvino: false
    openvino_device: "CPU"
    category_mapping_path: "models/mom-domain-classifier/category_mapping.json"
  pii_model:
    model_id: "models/mom-pii-classifier"
    use_modernbert: false
    threshold: 0.9
    use_cpu: true
    use_openvino: false
    openvino_device: "CPU"
    pii_mapping_path: "models/mom-pii-classifier/pii_type_mapping.json"

jailbreak:
  - name: "guard"
    threshold: 0.7
    description: "Block any input the prompt-guard model flags as a jailbreak."

pii:
  - name: "pii_block"
    threshold: 0.9
    pii_types_allowed: []
    description: "Block any input that contains any PII entity."

vllm_endpoints:
  - name: "xpu-llama3b"
    address: "127.0.0.1"
    port: 11434
    weight: 1
    type: "vllm"
  - name: "xpu-qwen7b"
    address: "127.0.0.1"
    port: 11435
    weight: 1
    type: "vllm"

model_config:
  "llama-3b":
    preferred_endpoints: ["xpu-llama3b"]
    external_model_ids:
      vllm: "meta-llama/Llama-3.2-3B-Instruct"
  "qwen-7b":
    reasoning_family: "qwen3"
    preferred_endpoints: ["xpu-qwen7b"]
    external_model_ids:
      vllm: "Qwen/Qwen2.5-7B-Instruct"

categories:
  - name: business
    description: "Business and management related queries"
    mmlu_categories: ["business"]
  - name: law
    description: "Legal questions and law-related topics"
    mmlu_categories: ["law"]
  - name: psychology
    description: "Psychology and mental health topics"
    mmlu_categories: ["psychology"]
  - name: biology
    description: "Biology and life sciences questions"
    mmlu_categories: ["biology"]
  - name: chemistry
    description: "Chemistry and chemical sciences questions"
    mmlu_categories: ["chemistry"]
  - name: history
    description: "Historical questions and cultural topics"
    mmlu_categories: ["history"]
  - name: other
    description: "General knowledge and miscellaneous topics"
    mmlu_categories: ["other"]
  - name: health
    description: "Health and medical information queries"
    mmlu_categories: ["health"]
  - name: economics
    description: "Economics and financial topics"
    mmlu_categories: ["economics"]
  - name: math
    description: "Mathematics and quantitative reasoning"
    mmlu_categories: ["math"]
  - name: physics
    description: "Physics and physical sciences"
    mmlu_categories: ["physics"]
  - name: "computer science"
    description: "Computer science and programming"
    mmlu_categories: ["computer science"]
  - name: philosophy
    description: "Philosophy and ethical questions"
    mmlu_categories: ["philosophy"]
  - name: engineering
    description: "Engineering and technical problem-solving"
    mmlu_categories: ["engineering"]

strategy: "priority"

decisions:
  - name: "business_decision"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "business"
        - operator: "NOT"
          conditions:
            - type: "jailbreak"
              name: "guard"
        - operator: "NOT"
          conditions:
            - type: "pii"
              name: "pii_block"
    modelRefs:
      - model: "llama-3b"
        use_reasoning: false

  - name: "law_decision"

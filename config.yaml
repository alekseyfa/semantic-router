version: v0.1

listeners:
  - name: "http-8899"
    address: "0.0.0.0"
    port: 8899
    timeout: "300s"

routing:
  modelCards:
    - name: "Qwen/Qwen2.5-3B-Instruct"
  decisions:
    - name: "default-route"
      description: "Catch-all: route every request to Qwen2.5-3B on Arc B570"
      priority: 100
      rules:
        operator: "AND"
        conditions: []
      modelRefs:
        - model: "Qwen/Qwen2.5-3B-Instruct"

providers:
  models:
    - name: "Qwen/Qwen2.5-3B-Instruct"
      backend_refs:
        - name: "primary"
          weight: 100
          endpoint: "localhost:11434"
